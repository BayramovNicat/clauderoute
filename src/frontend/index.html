<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Claude Code Env Settings</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<main class="app-shell" aria-label="Claude Code environment settings">
			<section class="panel" id="environment">
				<div class="panel-heading">
					<div>
						<p class="eyebrow">Configuration</p>
						<h1>Environment</h1>
					</div>
					<button class="primary-button" id="save-env" type="button">Save env</button>
				</div>
				<div class="field-grid" id="env-fields"></div>
				<div class="message" id="messages" hidden></div>
			</section>

			<section class="panel" id="providers">
				<div class="panel-heading">
					<div>
						<p class="eyebrow">Connections</p>
						<h2>Active providers</h2>
					</div>
					<button class="secondary-button" id="refresh-providers" type="button">Refresh</button>
				</div>
				<div class="provider-grid" id="providers-list"></div>
			</section>
		</main>
		<script type="module" src="/app.js"></script>
	</body>
</html>
